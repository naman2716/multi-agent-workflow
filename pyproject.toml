[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.4.0"
description = "Multi-agent coding orchestrator on the Claude Agent SDK: planner, parallel workers in git worktrees, quality gates, independent review."
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2.150"]

[project.optional-dependencies]
graph = ["graphifyy[mcp]>=0.9"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools]
packages = ["orchestra"]
